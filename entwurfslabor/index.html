<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1971c2">
  <meta name="description" content="Vaals Entwurfslabor – Szenario-Rechner für Wasser- und Hitzeresilienz im Planungsgebiet Selzerbeek">
  <title>Vaals Entwurfslabor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='30 30 454 454'%3E%3Crect x='30' y='30' width='454' height='454' rx='90' fill='%231971c2'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='30' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M166 98q-62 84-62 128a62 62 0 0 0 124 0q0-44-62-128zM290 294v-70M350 294v-150M410 294v-100M80 354q29.5-24 59 0t59 0 59 0 59 0 59 0 59 0M80 406q29.5-24 59 0t59 0 59 0 59 0 59 0 59 0'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css?v=0.3.5">
</head>
<body>
  <header class="kopf" id="kopf">
    <div class="kopf-zeile">
      <div class="marke">
        <a id="btn-start" class="zur-start" href="#" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
        <svg class="logo" viewBox="62 63 390 390" aria-hidden="true"><path d="M166 98q-62 84-62 128a62 62 0 0 0 124 0q0-44-62-128zM290 294v-70M350 294v-150M410 294v-100M80 354q29.5-24 59 0t59 0 59 0 59 0 59 0 59 0M80 406q29.5-24 59 0t59 0 59 0 59 0 59 0 59 0"/></svg>
        <div><strong>Vaals Entwurfslabor</strong><span data-i18n="untertitel">Vaals · Senserbach</span></div>
      </div>
      <nav class="szenarien" id="szenarien" role="tablist"></nav>
      <div class="aktionen">
        <button id="btn-sprache" class="rund" type="button">NL</button>
        <button id="btn-einst" class="rund" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
        <button id="btn-info" class="rund" type="button">i</button>
      </div>
    </div>
    <div class="kurz" id="kurz" aria-hidden="true"></div>
  </header>

  <div class="rahmen">
    <aside class="panel leiste" id="p-regler">
      <div class="panel-kopf">
        <h2 data-i18n="regler">Regler</h2>
      </div>
      <label class="namefeld">
        <span data-i18n="szenarioName">Name des Szenarios</span>
        <input id="sz-name" type="text" maxlength="40" autocomplete="off">
      </label>
      <div id="regler"></div>
      <p class="fussnote" id="regler-fuss"></p>
      <div class="btn-reihe leiste-knoepfe">
        <button id="btn-reset" class="btn klein" type="button" data-i18n="zuruecksetzen">Eingaben zurücksetzen</button>
        <button id="btn-entfernen" class="btn klein" type="button" data-i18n="entfernen">Variante löschen</button>
      </div>
    </aside>

    <main class="raster">
      <section class="panel" id="p-kennzahlen">
        <div class="panel-kopf">
          <h2 data-i18n="kennzahlen">Kennzahlen</h2>
          <span class="unter" id="kz-unter"></span>
        </div>
        <div id="kz-warnung"></div>
        <div class="kacheln" id="kacheln"></div>
        <p class="fussnote" id="ampel-legende"></p>
      </section>

      <section class="panel" id="p-diagramm">
        <div class="panel-kopf">
          <h2 data-i18n="vergleich">Vergleich der Szenarien</h2>
          <div class="segment" id="ansicht" role="group"></div>
          <div class="icon-reihe">
            <button id="btn-png" class="icon-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg></button>
            <button id="btn-csv" class="icon-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M10 4v16"/></svg></button>
          </div>
        </div>
        <div class="chart-box"><canvas id="chart"></canvas></div>
      </section>

      <section class="panel" id="p-bilanz">
        <div class="panel-kopf">
          <h2 data-i18n="bilanz">Flächenbilanz</h2>
          <span class="unter" id="bilanz-unter"></span>
          <label class="ph-schalter"><input type="checkbox" id="ph-schalter"> <span data-i18n="platzhalterSchalter">Platzhalter</span></label>
        </div>
        <div id="bilanz-warnung"></div>
        <div class="tabelle-scroll"><table class="bilanz" id="bilanz"></table></div>
        <p class="fussnote" id="bilanz-quelle"></p>
      </section>

      <section class="panel" id="p-karte">
        <div class="panel-kopf">
          <h2 data-i18n="karteTitel">Planungsgebiet</h2>
        </div>
        <div id="map"></div>
        <div id="import" class="import"></div>
      </section>
    </main>
  </div>

  <dialog id="dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Vaals Entwurfslabor benötigt JavaScript.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
          integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script>
    // config.js und app.js immer frisch vom Server laden, damit Änderungen sofort wirken
    (function () {
      var v = Date.now();
      ['config.js', 'app.js'].forEach(function (src) {
        var s = document.createElement('script');
        s.src = src + '?v=' + v;
        s.async = false;
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
