<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e10a17">
  <meta name="description" content="Klima Chancen – Potenzialflächen für doppelte Innenentwicklung in Vaals erfassen und bewerten (Prototyp, KI-generiert)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Klima Chancen">
  <title>Klima Chancen</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css"
        integrity="sha384-nfYqa/3Xh7kCl9/bO8fCcmqGuhuVWAle+CQgdE/LdgaQiO6fSkKh8C0fLdCVrrQJ" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <div><strong>Klima Chancen</strong><span data-i18n="untertitel">Vaals · Senserbach</span></div>
    </div>
    <div class="topbar-actions">
      <button id="btn-lang" class="btn-round" type="button" data-i18n-aria="sprache">NL</button>
      <button id="btn-einst" class="btn-round" type="button" data-i18n-aria="einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
      <button id="btn-info" class="btn-round" type="button" data-i18n-aria="info">i</button>
    </div>
  </header>

  <main id="main">
    <div id="map"></div>

    <div class="basemap-switch" role="group">
      <button type="button" data-basemap="osm" class="active" data-i18n="karte">Karte</button>
      <button type="button" data-basemap="luftbild" data-i18n="luftbild">Luftbild</button>
    </div>

    <div id="legende" class="legende"></div>
    <div id="draw-hint" class="draw-hint" data-i18n="zeichnenHinweis" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <section id="panel" class="panel" hidden>
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <button id="panel-close" class="btn-round btn-round--light" type="button" data-i18n-aria="schliessen">✕</button>
      </div>
      <div id="panel-body" class="panel-body"></div>
    </section>
  </main>

  <nav id="bottombar" class="bottombar">
    <button id="btn-zeichnen" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 7 6l12 3-2 9z"/><circle cx="5" cy="19" r="1.8"/><circle cx="7" cy="6" r="1.8"/><circle cx="19" cy="9" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>
      <span data-i18n="flaeche">Fläche</span>
    </button>
    <button id="btn-gps" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <span data-i18n="gpsPunkt">GPS-Punkt</span>
    </button>
    <button id="btn-liste" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>
      <span data-i18n="liste">Liste</span>
    </button>
    <button id="btn-beispiele" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span data-i18n="beispiele">Beispiele</span>
    </button>
    <button id="btn-home" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path d="M9 14l2-5 4 2-1 4z"/></svg>
      <span data-i18n="gebiet">Gebiet</span>
    </button>
  </nav>

  <nav id="drawbar" class="bottombar drawbar" hidden>
    <button id="btn-undo" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      <span data-i18n="zurueck">Punkt zurück</span>
    </button>
    <button id="btn-cancel" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      <span data-i18n="abbrechen">Abbrechen</span>
    </button>
    <button id="btn-finish" type="button" class="primary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg>
      <span data-i18n="fertig">Fertig</span>
    </button>
  </nav>

  <noscript>Klima Chancen benötigt JavaScript.</noscript>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.js"
          integrity="sha384-7CTDkMmRSjHvjl8ftuwzLq/ogrEnsuNoi3825eH06KuMNWWwcfaNIHol5+I3EAzO" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
